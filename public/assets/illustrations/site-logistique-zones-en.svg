<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <title>A logistics site divided into zones, from the perimeter to sensitive rooms</title>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#E9EBF5"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0D145A" stroke-width="2.2" opacity=".35"/>
    </pattern>
  </defs>

  <!-- Fond -->
  <rect width="560" height="600" fill="#F6F7FB"/>

  <!-- Voie publique -->
  <rect x="0" y="500" width="560" height="100" fill="#E3E6EF"/>
  <line x1="0" y1="552" x2="560" y2="552" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="22 16"/>
  <g fill="#B9BED3"><rect x="70" y="512" width="44" height="22" rx="6"/><rect x="380" y="566" width="44" height="22" rx="6"/></g>
  <text x="28" y="588" font-size="12" font-weight="600" letter-spacing="2" fill="#8A90AE">PUBLIC ROAD</text>

  <!-- Accès depuis la voie publique -->
  <rect x="245" y="470" width="60" height="30" fill="#DADDE8"/>

  <!-- Circulation interne -->
  <rect x="245" y="232" width="60" height="240" fill="#DADDE8"/>
  <rect x="50" y="232" width="460" height="52" fill="#DADDE8"/>
  <line x1="60" y1="258" x2="500" y2="258" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="12 10"/>

  <!-- Passage piétons -->
  <g fill="#FFFFFF">
    <rect x="249" y="356" width="5" height="22"/><rect x="259" y="356" width="5" height="22"/><rect x="269" y="356" width="5" height="22"/>
    <rect x="279" y="356" width="5" height="22"/><rect x="289" y="356" width="5" height="22"/><rect x="299" y="356" width="4" height="22"/>
  </g>
  <path d="M200 367 H245 M305 367 H330" stroke="#C9A24B" stroke-width="2.5" stroke-dasharray="5 5"/>

  <!-- Clôture périmétrique (ouverte à l'entrée) -->
  <path d="M245 470 H30 V30 H530 V470 H305" fill="none" stroke="#0D145A" stroke-width="4" stroke-dasharray="12 6"/>

  <!-- Barrière et guérite -->
  <line x1="247" y1="476" x2="300" y2="476" stroke="#FFFFFF" stroke-width="6"/>
  <line x1="247" y1="476" x2="300" y2="476" stroke="#C7362A" stroke-width="6" stroke-dasharray="8 7"/>
  <rect x="314" y="438" width="38" height="26" rx="3" fill="#0D145A"/>
  <text x="358" y="456" font-size="11" fill="#5B6185">Gatehouse</text>

  <!-- Entrepôt et production -->
  <rect x="50" y="50" width="210" height="160" fill="#E9EBF5" stroke="#0D145A" stroke-width="3"/>
  <text x="155" y="178" font-size="12" text-anchor="middle" fill="#5B6185">Warehouse</text>
  <rect x="300" y="50" width="210" height="160" fill="#E9EBF5" stroke="#0D145A" stroke-width="3"/>
  <text x="405" y="135" font-size="12" text-anchor="middle" fill="#5B6185">Production</text>
  <!-- Quais et poids lourds -->
  <g fill="#0D145A"><rect x="72" y="206" width="26" height="6"/><rect x="118" y="206" width="26" height="6"/><rect x="164" y="206" width="26" height="6"/><rect x="210" y="206" width="26" height="6"/></g>
  <g>
    <rect x="72" y="214" width="26" height="44" rx="2" fill="#B9BED3"/><rect x="74" y="258" width="22" height="12" rx="2" fill="#0D145A"/>
    <rect x="164" y="214" width="26" height="44" rx="2" fill="#B9BED3"/><rect x="166" y="258" width="22" height="12" rx="2" fill="#0D145A"/>
  </g>

  <!-- Bureaux -->
  <rect x="50" y="310" width="150" height="110" fill="#FFFFFF" stroke="#0D145A" stroke-width="3"/>
  <text x="125" y="400" font-size="12" text-anchor="middle" fill="#5B6185">Offices</text>

  <!-- Parking -->
  <rect x="330" y="310" width="100" height="110" fill="#FFFFFF" stroke="#B9BED3" stroke-width="2"/>
  <g stroke="#B9BED3" stroke-width="2"><line x1="330" y1="337" x2="380" y2="337"/><line x1="330" y1="364" x2="380" y2="364"/><line x1="330" y1="391" x2="380" y2="391"/><line x1="380" y1="310" x2="380" y2="420"/></g>
  <text x="405" y="435" font-size="11" text-anchor="middle" fill="#5B6185">Parking</text>

  <!-- Local technique (zone sensible) -->
  <rect x="448" y="320" width="62" height="86" fill="url(#hatch)" stroke="#0D145A" stroke-width="5"/>
  <text x="479" y="425" font-size="11" text-anchor="middle" fill="#5B6185">Technical</text>

  <!-- Repères -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="30" cy="150" r="17" fill="#C9A24B"/><text x="30" y="155" fill="#0D145A">1</text>
    <circle cx="225" cy="488" r="17" fill="#C9A24B"/><text x="225" y="493" fill="#0D145A">2</text>
    <circle cx="380" cy="258" r="17" fill="#C9A24B"/><text x="380" y="263" fill="#0D145A">3</text>
    <circle cx="155" cy="128" r="17" fill="#C9A24B"/><text x="155" y="133" fill="#0D145A">4</text>
    <circle cx="479" cy="350" r="17" fill="#C9A24B"/><text x="479" y="355" fill="#0D145A">5</text>
  </g>

  <!-- Légende -->
  <rect x="560" width="240" height="600" fill="#0D145A"/>
  <text x="590" y="64" font-size="12" font-weight="600" letter-spacing="2" fill="#C9A24B">PERIMETER TO CORE</text>
  <text x="590" y="96" font-size="21" font-weight="700" fill="#FFFFFF">One site,</text>
  <text x="590" y="122" font-size="21" font-weight="700" fill="#FFFFFF">several zones</text>

  <g font-size="14" fill="#FFFFFF">
    <circle cx="604" cy="176" r="14" fill="#C9A24B"/><text x="604" y="181" font-size="13" font-weight="700" text-anchor="middle" fill="#0D145A">1</text>
    <text x="630" y="173">Perimeter</text><text x="630" y="191" fill="#AEB3D6" font-size="12">fence, detection</text>

    <circle cx="604" cy="240" r="14" fill="#C9A24B"/><text x="604" y="245" font-size="13" font-weight="700" text-anchor="middle" fill="#0D145A">2</text>
    <text x="630" y="237">Access</text><text x="630" y="255" fill="#AEB3D6" font-size="12">people and vehicles</text>

    <circle cx="604" cy="304" r="14" fill="#C9A24B"/><text x="604" y="309" font-size="13" font-weight="700" text-anchor="middle" fill="#0D145A">3</text>
    <text x="630" y="301">Circulation</text><text x="630" y="319" fill="#AEB3D6" font-size="12">pedestrians, trucks</text>

    <circle cx="604" cy="368" r="14" fill="#C9A24B"/><text x="604" y="373" font-size="13" font-weight="700" text-anchor="middle" fill="#0D145A">4</text>
    <text x="630" y="365">Buildings</text><text x="630" y="383" fill="#AEB3D6" font-size="12">storage, production</text>

    <circle cx="604" cy="432" r="14" fill="#C9A24B"/><text x="604" y="437" font-size="13" font-weight="700" text-anchor="middle" fill="#0D145A">5</text>
    <text x="630" y="429">Sensitive areas</text><text x="630" y="447" fill="#AEB3D6" font-size="12">technical rooms</text>
  </g>

  <line x1="590" y1="492" x2="770" y2="492" stroke="#2A3278"/>
  <text x="590" y="522" font-size="12.5" fill="#D6D9EE">Control the entrance firmly</text>
  <text x="590" y="541" font-size="12.5" fill="#D6D9EE">to move more freely</text>
  <text x="590" y="560" font-size="12.5" fill="#D6D9EE">inside.</text>
</svg>
